name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps || npm install

      - name: Build Web Game
        run: |
          npm run build

      - name: Add Android Platform if Missing
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Force Upgrade Gradle to 8.4 (Fixes ClassReader crash)
        working-directory: android
        run: |
          chmod +x gradlew
          sed -i 's/gradle-.*-all.zip/gradle-8.4-all.zip/g' gradle/wrapper/gradle-wrapper.properties || true
          sed -i 's/gradle-.*-bin.zip/gradle-8.4-bin.zip/g' gradle/wrapper/gradle-wrapper.properties || true

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TheRace-Game-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
